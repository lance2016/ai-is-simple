<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent Loop 手绘草图</title>
  <desc id="desc">用户任务只输入一次，模型决定是否调用工具，工具结果返回模型；不需要工具时输出答案并结束。</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14" fill="none" stroke="#253449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14" fill="none" stroke="#4d806c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="softNoise">
        <feFuncA type="table" tableValues="0 0.04"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#fcfbf8"/>
  <g filter="url(#paper)">
    <path d="M92 132 C350 125 615 139 880 130 S1330 130 1500 134" fill="none" stroke="#d7dce3" stroke-width="3" stroke-linecap="round"/>
    <text x="100" y="92" fill="#253449" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="42" font-weight="600">可以把它记成：</text>

    <!-- 第一次输入：只从用户进入一次 -->
    <g transform="rotate(-1 205 310)">
      <rect x="100" y="245" width="230" height="130" rx="18" fill="#fffdf9" stroke="#253449" stroke-width="4"/>
      <path d="M110 254 C160 240 266 249 320 256" fill="none" stroke="#cdd5df" stroke-width="2"/>
      <text x="215" y="305" text-anchor="middle" fill="#253449" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600">用户任务</text>
      <text x="215" y="348" text-anchor="middle" fill="#697586" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24">只输入一次</text>
    </g>

    <!-- 模型决定 -->
    <g transform="rotate(1 545 310)">
      <rect x="420" y="245" width="260" height="130" rx="18" fill="#fffdf9" stroke="#253449" stroke-width="4"/>
      <text x="550" y="322" text-anchor="middle" fill="#253449" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700">模型决定</text>
    </g>

    <!-- 工具执行 -->
    <g transform="rotate(-1 900 310)">
      <rect x="770" y="245" width="260" height="130" rx="18" fill="#fffdf9" stroke="#253449" stroke-width="4"/>
      <text x="900" y="322" text-anchor="middle" fill="#253449" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700">工具执行</text>
    </g>

    <!-- 工具结果 -->
    <g transform="rotate(1 1250 310)">
      <rect x="1120" y="245" width="260" height="130" rx="18" fill="#fffdf9" stroke="#253449" stroke-width="4"/>
      <text x="1250" y="322" text-anchor="middle" fill="#253449" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700">工具结果</text>
    </g>

    <!-- 主路径：用户只进入一次，之后只在模型和工具之间循环 -->
    <path d="M330 310 C360 310 382 310 414 310" fill="none" stroke="#253449" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <path d="M680 310 C715 310 735 310 764 310" fill="none" stroke="#253449" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <path d="M1030 310 C1060 310 1085 310 1112 310" fill="none" stroke="#253449" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>

    <!-- 工具结果回到模型，而不是回到用户 -->
    <path d="M1250 380 C1250 520 1120 570 900 570 C700 570 555 520 555 390" fill="none" stroke="#253449" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <text x="900" y="535" text-anchor="middle" fill="#697586" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="28">模型根据工具结果继续决定</text>

    <!-- 终止分支：不再调用工具 -->
    <path d="M520 380 C500 470 390 555 365 660" fill="none" stroke="#4d806c" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    <text x="315" y="525" text-anchor="middle" fill="#4d806c" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="28" transform="rotate(-25 315 525)">无需工具调用</text>

    <g transform="rotate(-1 500 745)">
      <rect x="210" y="655" width="360" height="125" rx="20" fill="#eef6f0" stroke="#4d806c" stroke-width="4"/>
      <circle cx="275" cy="718" r="28" fill="#4d806c"/>
      <path d="M260 718 L271 730 L293 704" fill="none" stroke="#fffdf9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="420" y="710" text-anchor="middle" fill="#253449" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700">输出答案</text>
      <text x="420" y="750" text-anchor="middle" fill="#4d806c" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27">结束</text>
    </g>

    <text x="800" y="755" text-anchor="middle" fill="#697586" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="28">循环发生在：模型决定 ↔ 工具执行 ↔ 工具结果</text>
    <path d="M100 835 C420 827 720 842 1030 833 S1370 834 1500 839" fill="none" stroke="#d7dce3" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
