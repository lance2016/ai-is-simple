<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mini Coding Agent</title>
<style>
  :root {
    --bg: #15171c;
    --panel: #1c1f26;
    --line: #2b3039;
    --text: #e6e8ec;
    --muted: #8b94a3;
    --accent: #5fb4a2;
    --warn: #e0a955;
    --error: #e06c5f;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "PingFang SC", sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  .workspace { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status { margin-left: auto; font-size: 13px; color: var(--muted); }
  .status.busy { color: var(--accent); }
  .status.error { color: var(--error); }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    padding: 5px 12px;
  }
  button:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
  button:disabled { opacity: 0.45; cursor: default; }

  #timeline {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .hint { color: var(--muted); font-size: 14px; }

  .user { align-self: flex-end; max-width: 70%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; white-space: pre-wrap; }
  .assistant { max-width: 80%; white-space: pre-wrap; }

  .card { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--panel); padding: 10px 14px; max-width: 80%; }
  .card.ask { border-left-color: var(--warn); }
  .card.fail { border-left-color: var(--error); color: var(--error); white-space: pre-wrap; }
  .card-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .card-head code { font-family: var(--mono); font-size: 13px; color: var(--accent); }
  .card.ask .card-head code { color: var(--warn); }
  .card-head .state { margin-left: auto; font-size: 12px; }

  pre { margin: 8px 0 0; padding: 8px 10px; background: rgba(0,0,0,0.28); border-radius: 6px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }
  details { margin-top: 8px; }
  summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  details pre { margin-top: 6px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .allow { border-color: var(--warn); color: var(--warn); }
  .allow:hover:not(:disabled) { background: var(--warn); color: var(--bg); border-color: var(--warn); }

  footer { border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  #send { border-color: var(--accent); color: var(--accent); padding: 9px 18px; }
  #send:hover:not(:disabled) { background: var(--accent); color: var(--bg); }
</style>
</head>
<body>
  <header>
    <h1>Mini Coding Agent</h1>
    <span class="workspace" id="workspace">连接中……</span>
    <span class="status" id="status">就绪</span>
    <button id="reset" type="button">清空上下文</button>
  </header>

  <div id="timeline">
    <p class="hint">试试：列出 labs 目录里有什么，然后读一下里面的 README。</p>
  </div>

  <footer>
    <textarea id="input" rows="2" placeholder="想让 Agent 做什么？Enter 发送，Shift + Enter 换行"></textarea>
    <button id="send" type="button">发送</button>
  </footer>

<script>
const timeline = document.querySelector("#timeline");
const input = document.querySelector("#input");
const sendButton = document.querySelector("#send");
const resetButton = document.querySelector("#reset");
const statusEl = document.querySelector("#status");
const workspaceEl = document.querySelector("#workspace");

// 后端事件已经编号，断线重连时带上 cursor 就不会丢事件、也不会重复。
let cursor = 0;
let busy = false;
const toolCards = new Map();
const permissionCards = new Map();

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function add(node) {
  const hint = timeline.querySelector(".hint");
  if (hint) hint.remove();
  timeline.append(node);
  timeline.scrollTop = timeline.scrollHeight;
  return node;
}

function setBusy(value) {
  busy = value;
  sendButton.disabled = value;
  resetButton.disabled = value;
  statusEl.textContent = value ? "运行中" : "就绪";
  statusEl.className = "status" + (value ? " busy" : "");
}

function pretty(value) {
  return typeof value === "string" ? value : JSON.stringify(value, null, 2);
}

// 一个工具调用先画出参数，结果回来后再补到同一张卡片里。
function renderToolCall(event) {
  const card = el("div", "card");
  const head = el("div", "card-head");
  head.append(el("span", "", "工具调用"), el("code", "", event.name), el("span", "state", "执行中"));
  card.append(head, el("pre", "", pretty(event.arguments)));
  toolCards.set(event.call_id, card);
  add(card);
}

function renderToolResult(event) {
  const card = toolCards.get(event.call_id);
  if (!card) return;
  const failed = (event.content || "").startsWith("Error:") || (event.content || "").startsWith("Blocked:");
  card.querySelector(".state").textContent = failed ? "未完成" : "已完成";
  const box = el("details");
  box.open = true;
  box.append(el("summary", "", "工具返回"), el("pre", "", event.content || "(无输出)"));
  card.append(box);
  timeline.scrollTop = timeline.scrollHeight;
}

async function answer(requestId, allowed, card) {
  card.querySelectorAll("button").forEach((b) => { b.disabled = true; });
  await fetch("/api/permission", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ request_id: requestId, allowed }),
  });
}

function renderPermission(event) {
  const card = el("div", "card ask");
  const head = el("div", "card-head");
  head.append(el("span", "", "需要授权"), el("span", "state", "等你决定"));
  const actions = el("div", "actions");
  const allow = el("button", "allow", "允许执行");
  const deny = el("button", "", "拒绝");
  allow.onclick = () => answer(event.request_id, true, card);
  deny.onclick = () => answer(event.request_id, false, card);
  actions.append(allow, deny);
  card.append(head, el("pre", "", event.action), actions);
  permissionCards.set(event.request_id, card);
  add(card);
}

function renderPermissionResult(event) {
  const card = permissionCards.get(event.request_id);
  if (!card) return;
  card.querySelector(".state").textContent = event.allowed ? "已允许" : "已拒绝";
  card.querySelectorAll("button").forEach((b) => { b.disabled = true; });
}

function render(event) {
  cursor = event.id;
  switch (event.type) {
    case "ready":
      workspaceEl.textContent = event.workspace;
      break;
    case "user_message":
      add(el("div", "user", event.content));
      break;
    case "assistant_message":
      if (event.content) add(el("div", "assistant", event.content));
      break;
    case "tool_call":
      renderToolCall(event);
      break;
    case "tool_result":
      renderToolResult(event);
      break;
    case "permission_request":
      renderPermission(event);
      break;
    case "permission_result":
      renderPermissionResult(event);
      break;
    case "error":
      add(el("div", "card fail", event.content));
      break;
    case "busy":
      setBusy(true);
      break;
    case "idle":
      setBusy(false);
      break;
    case "reset":
      timeline.replaceChildren(el("p", "hint", "上下文已清空。工作区里改过的文件不会回滚。"));
      toolCards.clear();
      permissionCards.clear();
      break;
  }
}

// SSE：服务端把事件推过来，不用定时轮询。断了就带着 cursor 重连。
function connect() {
  const source = new EventSource(`/api/events?after=${cursor}`);
  source.onmessage = (message) => render(JSON.parse(message.data));
  source.onerror = () => {
    source.close();
    statusEl.textContent = "连接断开，重连中";
    statusEl.className = "status error";
    setTimeout(connect, 1000);
  };
  source.onopen = () => setBusy(busy);
}

async function send() {
  const message = input.value.trim();
  if (!message || busy) return;
  input.value = "";
  const response = await fetch("/api/message", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message }),
  });
  if (!response.ok) input.value = message;
}

sendButton.onclick = send;
resetButton.onclick = () => fetch("/api/reset", { method: "POST" });
input.onkeydown = (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    send();
  }
};

connect();
</script>
</body>
</html>
