<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mini Coding Agent</title>
<!-- 字体、Markdown 解析、HTML 清洗、代码高亮。没加载到时退回系统字体和纯文本，照样能用。 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/styles/github.min.css" />
<script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/highlight.min.js"></script>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Mini Coding Agent</h1>
    <span class="root-path" id="root">连接中</span>
    <span class="state" id="state"><span class="dot"></span><span id="stateText">就绪</span></span>
    <button class="ghost" id="clear" type="button" title="清空对话上下文，已经改动的文件不会回滚">新对话</button>
  </header>

  <main id="stream">
    <div class="inner" id="feed"></div>
  </main>

  <form class="composer" id="composer">
    <button id="newer" type="button">有新内容</button>
    <div id="beacon" role="status">
      <span>有一步在等你决定</span>
      <button class="ghost" type="button" id="jump">去看看</button>
    </div>
    <div class="inner">
      <textarea id="input" rows="1" placeholder="让它做点什么，比如：看看 labs 目录里有什么"></textarea>
      <button id="send" type="submit">发送</button>
    </div>
    <p class="inner" id="hint" aria-live="polite"></p>
  </form>

<script type="module" src="/app.js"></script>
</body>
</html>
