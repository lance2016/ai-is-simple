<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mini Coding Agent</title>
<style>
  :root {
    --bg: #0f1219;
    --surface: #161b24;
    --surface-2: #1b212c;
    --line: #262d3a;
    --rail: #2b3444;
    --text: #e3e7ee;
    --dim: #8b94a6;
    --faint: #626c7d;
    --model: #b39ae0;   /* 模型在说话 */
    --exec: #45c7e0;    /* 程序在执行 */
    --ask: #f2b04c;     /* 等你决定 */
    --bad: #ea6a60;
    --good: #5fd9a0;
    --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.7 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  button { font: inherit; cursor: pointer; }
  button:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 2px solid var(--exec);
    outline-offset: 2px;
  }

  /* ── 顶栏 ───────────────────────────────────────── */
  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 22px;
    height: 52px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .topbar h1 { margin: 0; flex: none; font-size: 14.5px; font-weight: 600; letter-spacing: 0.01em; }
  .root-path {
    font: 12px/1 var(--mono);
    color: var(--faint);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .state { margin-left: auto; flex: none; display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--dim); }
  .state .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .state.on .dot { background: var(--exec); animation: pulse 1.4s ease-in-out infinite; }
  .state.on { color: var(--exec); }
  .state.off .dot, .state.off { color: var(--bad); }
  .state.off .dot { background: var(--bad); }
  @keyframes pulse { 50% { opacity: 0.25; } }

  .ghost {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--dim);
    border-radius: 6px;
    padding: 5px 11px;
    font-size: 13px;
  }
  .ghost:hover:not(:disabled) { color: var(--text); border-color: var(--rail); background: var(--surface-2); }
  .ghost:disabled { opacity: 0.4; cursor: default; }

  /* ── 时间线 ─────────────────────────────────────── */
  #stream {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 30px 22px 14px;
    scrollbar-color: var(--rail) transparent;
  }
  .inner { max-width: 860px; margin: 0 auto; }

  .run + .run { margin-top: 30px; }
  .task {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .task p { margin: 0; flex: 1; min-width: 0; white-space: pre-wrap; font-size: 16.5px; font-weight: 500; }
  .task .clock { flex: none; font: 11.5px/1.7 var(--mono); color: var(--faint); }

  /* 轨道：所有执行步骤都挂在这条线上 */
  .steps {
    margin-left: 7px;
    padding: 18px 0 2px 26px;
    border-left: 1px solid var(--rail);
  }
  .step { position: relative; }
  .step + .step { margin-top: 26px; }
  .step::before {                       /* 轨道标记 */
    content: "";
    position: absolute;
    left: -31px;
    top: 7px;
    width: 9px;
    height: 9px;
    background: var(--bg);
    border: 1.5px solid var(--dim);
  }
  .step[data-kind="model"]::before { border-radius: 50%; border-color: var(--model); }
  .step[data-kind="exec"]::before  { transform: rotate(45deg); border-color: var(--exec); }
  .step[data-kind="ask"]::before   {
    border-color: var(--ask);
    background: var(--ask);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--ask) 18%, transparent);
    animation: breathe 1.8s ease-in-out infinite;
  }
  @keyframes breathe { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--ask) 6%, transparent); } }
  .step[data-kind="bad"]::before   { border-radius: 50%; border-color: var(--bad); background: var(--bad); }

  .say { color: var(--text); white-space: pre-wrap; max-width: 68ch; }
  .step[data-kind="model"] .say { border-left: 2px solid color-mix(in srgb, var(--model) 70%, transparent); padding-left: 12px; margin-left: -14px; }
  .step[data-kind="bad"] .say { color: var(--bad); font-family: var(--mono); font-size: 13px; }

  /* ── 工具卡片 ───────────────────────────────────── */
  .head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 8px; flex-wrap: wrap; }
  .tool { font: 600 13.5px/1 var(--mono); color: var(--exec); }
  .step[data-kind="ask"] .tool { color: var(--ask); }
  .target { font: 13px/1 var(--mono); color: var(--dim); min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note { margin-left: auto; flex: none; white-space: nowrap; font-size: 12px; color: var(--faint); }
  .note.wait { color: var(--ask); }
  .note.ok { color: var(--good); }
  .note.no { color: var(--bad); }

  .cmd {
    font: 13px/1.6 var(--mono);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 9px 12px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .cmd .sigil { color: var(--exec); user-select: none; margin-right: 8px; }

  .block {
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 7px;
    overflow: hidden;
    background: var(--surface);
  }
  .block-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    font-size: 11.5px;
    color: var(--faint);
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
  }
  .exit { font-family: var(--mono); }
  .exit.ok { color: var(--good); }
  .exit.no { color: var(--bad); }
  pre {
    margin: 0;
    padding: 10px 12px;
    font: 12.5px/1.65 var(--mono);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 22em;
    overflow: auto;
    scrollbar-color: var(--rail) transparent;
  }
  pre .ln { color: var(--faint); user-select: none; }
  pre .del { color: var(--bad); }
  pre .ins { color: var(--good); }
  .more {
    display: block;
    width: 100%;
    text-align: left;
    padding: 7px 12px;
    border: 0;
    border-top: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--dim);
    font-size: 12px;
  }
  .more:hover { color: var(--text); }

  details.raw { margin-top: 7px; }
  details.raw summary { font-size: 12px; color: var(--faint); cursor: pointer; list-style: none; }
  details.raw summary::-webkit-details-marker { display: none; }
  details.raw summary::before { content: "▸ "; }
  details.raw[open] summary::before { content: "▾ "; }
  details.raw summary:hover { color: var(--dim); }
  details.raw pre { margin-top: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }

  /* ── 授权 ───────────────────────────────────────── */
  .gate {
    margin-top: 10px;
    border: 1px solid color-mix(in srgb, var(--ask) 35%, var(--line));
    border-radius: 7px;
    background: color-mix(in srgb, var(--ask) 6%, var(--surface));
    padding: 11px 13px;
  }
  .gate p { margin: 0 0 10px; font-size: 13.5px; color: var(--text); }
  .gate .why { color: var(--dim); font-size: 12.5px; }
  .acts { display: flex; gap: 9px; }
  .allow {
    border: 1px solid var(--ask);
    border-radius: 6px;
    background: var(--ask);
    color: #21160a;
    font-weight: 600;
    padding: 6px 15px;
    font-size: 13.5px;
  }
  .allow:hover:not(:disabled) { filter: brightness(1.12); }
  .deny {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--dim);
    padding: 6px 15px;
    font-size: 13.5px;
  }
  .deny:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); }
  .acts button:disabled { opacity: 0.35; cursor: default; }
  .verdict { margin-top: 9px; font-size: 12.5px; color: var(--dim); }
  .verdict::before { content: "✓ "; color: var(--good); }
  .verdict.no::before { content: "✕ "; color: var(--bad); }

  /* ── 空状态 ─────────────────────────────────────── */
  .blank { max-width: 560px; margin: 8vh auto 0; }
  .blank h2 { margin: 0 0 12px; font-size: 19px; font-weight: 600; }
  .blank p { margin: 0 0 22px; color: var(--dim); max-width: 46ch; }
  .legend { display: grid; gap: 9px; margin-bottom: 26px; }
  .legend div { display: flex; align-items: center; gap: 11px; font-size: 13.5px; color: var(--dim); }
  .legend i { width: 9px; height: 9px; flex: none; border: 1.5px solid; }
  .legend .m { border-radius: 50%; border-color: var(--model); }
  .legend .e { transform: rotate(45deg); border-color: var(--exec); }
  .legend .a { border-color: var(--ask); background: var(--ask); }
  .try { display: grid; gap: 8px; }
  .try button {
    text-align: left;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface);
    color: var(--dim);
    padding: 10px 13px;
    font-size: 13.5px;
  }
  .try button:hover { color: var(--text); border-color: var(--rail); }

  /* ── 输入区 ─────────────────────────────────────── */
  .composer {
    flex: none;
    position: relative;
    border-top: 1px solid var(--line);
    background: var(--surface);
    padding: 12px 22px 14px;
  }
  .composer .inner { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1;
    resize: none;
    font: 15px/1.6 var(--sans);
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 13px;
    max-height: 9em;
  }
  textarea::placeholder { color: var(--faint); }
  textarea:focus { outline: none; border-color: var(--rail); }
  #send {
    flex: none;
    border: 1px solid var(--exec);
    border-radius: 8px;
    background: transparent;
    color: var(--exec);
    padding: 9px 20px;
    font-weight: 500;
  }
  #send:hover:not(:disabled) { background: var(--exec); color: #06222a; }
  #send:disabled { opacity: 0.35; cursor: default; border-color: var(--line); color: var(--faint); }

  /* 待决授权滚出视口时的提示 */
  #beacon {
    position: absolute;
    left: 50%;
    top: -19px;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 8px;
    padding: 5px 14px;
    border: 1px solid var(--ask);
    border-radius: 999px;
    background: color-mix(in srgb, var(--ask) 16%, var(--bg));
    color: var(--ask);
    font-size: 12.5px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  }
  #beacon.show { display: flex; }

  @media (max-width: 620px) {
    #stream, .composer { padding-left: 14px; padding-right: 14px; }
    .steps { padding-left: 20px; }
    .step::before { left: -25px; }
    .root-path { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <h1>Mini Coding Agent</h1>
    <span class="root-path" id="root">连接中</span>
    <span class="state" id="state"><span class="dot"></span><span id="stateText">就绪</span></span>
    <button class="ghost" id="clear" type="button">清空</button>
  </header>

  <main id="stream">
    <div class="inner" id="feed"></div>
  </main>

  <form class="composer" id="composer">
    <div id="beacon" role="status">
      <span>有一步在等你决定</span>
      <button class="ghost" type="button" id="jump" style="padding:1px 8px;font-size:12px">去看看</button>
    </div>
    <div class="inner">
      <textarea id="input" rows="1" placeholder="让它做点什么，比如：看看 labs 目录里有什么"></textarea>
      <button id="send" type="submit">发送</button>
    </div>
  </form>

<script>
"use strict";

const feed = document.querySelector("#feed");
const stream = document.querySelector("#stream");
const input = document.querySelector("#input");
const sendBtn = document.querySelector("#send");
const clearBtn = document.querySelector("#clear");
const stateBox = document.querySelector("#state");
const stateText = document.querySelector("#stateText");
const rootPath = document.querySelector("#root");
const beacon = document.querySelector("#beacon");

let cursor = 0;          // 已经消费到第几号事件，重连时带上它
let busy = false;
let run = null;          // 当前这一段任务的 .steps 容器
const steps = new Map(); // call_id -> 这次工具调用的卡片状态
let openStep = null;     // 最近一个还没出结果的工具调用
let pending = null;      // 正在等你决定的那张卡

const MAX_LINES = 18;

/* ── 小工具 ─────────────────────────────────────── */

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function clock(seconds) {
  return new Date((seconds || Date.now() / 1000) * 1000)
    .toLocaleTimeString("zh-CN", { hour12: false });
}

function took(from, to) {
  const ms = Math.max(0, (to - from) * 1000);
  return ms < 950 ? `${Math.round(ms)}ms` : `${(ms / 1000).toFixed(1)}s`;
}

function atBottom() {
  return stream.scrollHeight - stream.scrollTop - stream.clientHeight < 140;
}

// 只在用户本来就在底部时才跟随，免得翻历史的时候被拽走
function place(node, container) {
  const follow = atBottom();
  (container || run || openRun()).append(node);
  if (follow) stream.scrollTop = stream.scrollHeight;
}

function openRun(taskText, at) {
  const section = el("section", "run");
  if (taskText !== undefined) {
    const head = el("div", "task");
    head.append(el("p", "", taskText), el("span", "clock", clock(at)));
    section.append(head);
  }
  run = el("div", "steps");
  section.append(run);
  const follow = atBottom();
  feed.append(section);
  if (follow) stream.scrollTop = stream.scrollHeight;
  return run;
}

function step(kind) {
  const node = el("article", "step");
  node.dataset.kind = kind;
  place(node);
  return node;
}

/* ── 输出渲染 ───────────────────────────────────── */

// 超过一屏的输出先给前 18 行，剩下的按需展开
function codeBlock(text, decorate) {
  const lines = text.split("\n");
  const pre = el("pre");
  const paint = (from, to) => {
    for (let i = from; i < to; i++) {
      (decorate || ((line) => document.createTextNode(line)))(lines[i], pre);
      if (i < lines.length - 1) pre.append("\n");
    }
  };
  const fill = (upto) => { pre.replaceChildren(); paint(0, upto); };
  fill(Math.min(lines.length, MAX_LINES));

  const wrap = el("div", "block");
  wrap.append(pre);
  if (lines.length > MAX_LINES) {
    const more = el("button", "more", `展开剩下 ${lines.length - MAX_LINES} 行`);
    more.type = "button";
    more.onclick = () => { fill(lines.length); more.remove(); };
    wrap.append(more);
  }
  return wrap;
}

function plain(line, pre) { pre.append(line); }

// read 的输出是 "12: content"，把行号调暗，内容才是重点
function numbered(line, pre) {
  const cut = line.match(/^(\s*\d+: )(.*)$/);
  if (!cut) return pre.append(line);
  pre.append(el("span", "ln", cut[1]), cut[2]);
}

function diffLine(line, pre) {
  if (line.startsWith("-")) pre.append(el("span", "del", line));
  else if (line.startsWith("+")) pre.append(el("span", "ins", line));
  else pre.append(line);
}

function looksNumbered(text) {
  return /^\s*\d+: /.test(text);
}

/* ── 工具参数：每个工具用它自己的样子展示 ─────────── */

function bashView(args, box) {
  const line = el("div", "cmd");
  line.append(el("span", "sigil", "$"), args.command || "");
  box.append(line);
}

function readView(args, box, head, target) {
  if (!target) return;
  target.textContent += `  第 ${args.start_line || 1}–${args.end_line || 200} 行`;
}

function writeView(args, box) {
  const body = codeBlock(String(args.content ?? ""), plain);
  body.prepend(bar(`将要写入 ${(args.content || "").length} 个字符`));
  box.append(body);
}

function editView(args, box) {
  const diff = [
    ...String(args.old_text ?? "").split("\n").map((l) => "- " + l),
    ...String(args.new_text ?? "").split("\n").map((l) => "+ " + l),
  ].join("\n");
  const body = codeBlock(diff, diffLine);
  body.prepend(bar("将要做的替换"));
  box.append(body);
}

function bar(label, extra) {
  const node = el("div", "block-bar");
  node.append(el("span", "", label));
  if (extra) node.append(extra);
  return node;
}

const VIEWS = { bash: bashView, read: readView, write: writeView, edit: editView };
const TARGET = { read: "path", write: "path", edit: "path" };

/* ── 事件 ───────────────────────────────────────── */

function onTask(e) {
  openRun(e.content, e.time);
}

function onSay(e) {
  if (!e.content) return;
  const node = step("model");
  node.append(el("div", "say", e.content));
}

function onToolCall(e) {
  const node = step("exec");
  const args = typeof e.arguments === "object" && e.arguments ? e.arguments : {};

  const head = el("div", "head");
  head.append(el("span", "tool", e.name));
  const key = TARGET[e.name];
  const target = key && args[key] ? el("span", "target", args[key]) : null;
  if (target) head.append(target);
  const note = el("span", "note", "执行中");
  head.append(note);
  node.append(head);

  (VIEWS[e.name] || (() => {}))(args, node, head, target);

  // 模型实际发出的 JSON。上面的视图为了好读省了些东西，这里是原文。
  const raw = el("details", "raw");
  raw.append(el("summary", "", "原始 JSON"));
  raw.append(el("pre", "", JSON.stringify(e.arguments, null, 2)));
  node.append(raw);

  const record = { node, head, note, raw, name: e.name, at: e.time, gated: false };
  steps.set(e.call_id, record);
  openStep = record;
}

function onAsk(e) {
  // Agent 是顺序执行的，同一时刻最多一个待决请求，它一定属于最后那次调用
  const host = openStep;
  const node = host ? host.node : step("ask");
  if (host) {
    host.node.dataset.kind = "ask";
    host.note.textContent = "等你决定";
    host.note.className = "note wait";
    host.gated = true;
  }

  const gate = el("div", "gate");
  // 工具名、目标和内容上面都写着了，这里不再重复，只问该不该做
  if (!host) gate.append(el("p", "", e.action));
  gate.append(el("p", "why", "这一步会改动工作区，程序不会替你决定。"));
  const acts = el("div", "acts");
  const ALLOW = { write: "允许写入", edit: "允许修改", bash: "允许运行" };
  const yes = el("button", "allow", (host && ALLOW[host.name]) || "允许执行");
  const no = el("button", "deny", "拒绝");
  yes.type = no.type = "button";
  yes.onclick = () => answer(e.request_id, true, gate);
  no.onclick = () => answer(e.request_id, false, gate);
  acts.append(yes, no);
  gate.append(acts);
  node.insertBefore(gate, host ? host.raw : null);

  pending = { node, gate };
  watchPending();
}

function onAskDone(e) {
  if (!pending) return;
  const mark = el("div", "verdict " + (e.allowed ? "yes" : "no"));
  mark.textContent = e.allowed ? "你允许了这一步" : "你拒绝了这一步";
  pending.gate.replaceWith(mark);
  const host = openStep;
  if (host) {
    host.note.textContent = e.allowed ? "已允许" : "已拒绝";
    host.note.className = "note " + (e.allowed ? "ok" : "no");
    host.node.dataset.kind = e.allowed ? "exec" : "bad";
  }
  pending = null;
  watchPending();
}

function onToolResult(e) {
  const record = steps.get(e.call_id);
  if (!record) return;
  const text = e.content || "";
  const failed = text.startsWith("Error:") || text.startsWith("Blocked:");

  if (!record.gated) {
    // 没有经过授权就跑完了，说明它落在只读白名单里 —— 这正是本例要说清楚的规则
    record.note.textContent = `只读，自动执行 · ${took(record.at, e.time)}`;
    record.note.className = "note";
  } else if (!failed) {
    record.note.textContent = "已执行";
    record.note.className = "note ok";
  }
  if (failed) {
    record.note.textContent = text.startsWith("Blocked:") ? "已拒绝" : "出错";
    record.note.className = "note no";
    record.node.dataset.kind = "bad";
  }

  const exit = text.match(/^exit_code=(\d+)\n?/);
  const body = exit ? text.slice(exit[0].length) : text;
  const block = codeBlock(body || "(没有输出)", looksNumbered(body) ? numbered : plain);

  const LABELS = { read: "文件内容", write: "结果", edit: "结果" };
  let label = LABELS[record.name] || "返回";
  let badge = null;
  if (exit) {
    label = "命令输出";
    badge = el("span", "exit " + (exit[1] === "0" ? "ok" : "no"), `exit ${exit[1]}`);
  } else if (failed) {
    label = "没有执行";
  }
  block.prepend(bar(label, badge));
  record.node.insertBefore(block, record.raw);

  if (openStep === record) openStep = null;
  if (atBottom()) stream.scrollTop = stream.scrollHeight;
}

function onFail(e) {
  const node = step("bad");
  node.append(el("div", "say", e.content));
}

function reset() {
  feed.replaceChildren();
  steps.clear();
  run = null;
  openStep = null;
  pending = null;
  watchPending();
  showBlank();
}

/* ── 待决提示 ───────────────────────────────────── */

let watcher = null;
function watchPending() {
  if (watcher) { watcher.disconnect(); watcher = null; }
  if (!pending) { beacon.classList.remove("show"); return; }
  watcher = new IntersectionObserver(
    ([entry]) => beacon.classList.toggle("show", !entry.isIntersecting),
    { root: stream, threshold: 0.35 }
  );
  watcher.observe(pending.gate);
}

document.querySelector("#jump").onclick = () => {
  if (pending) pending.gate.scrollIntoView({ block: "center", behavior: "smooth" });
};

/* ── 状态与空状态 ───────────────────────────────── */

function setBusy(value) {
  busy = value;
  sendBtn.disabled = value;
  clearBtn.disabled = value;
  stateText.textContent = value ? "运行中" : "就绪";
  stateBox.className = "state" + (value ? " on" : "");
}

const SAMPLES = [
  "看看 labs 目录里有什么，读一下里面的 README",
  "agent.py 里定义了哪几个工具？各自要不要授权？",
];

function showBlank() {
  const box = el("div", "blank");
  box.append(el("h2", "", "还没有任务"));
  box.append(el("p", "", "下面会按顺序记下每一步：模型说了什么、调用了哪个工具、参数是什么、返回了什么。会改动文件的步骤停下来等你点头。"));

  const legend = el("div", "legend");
  [["m", "模型在说话"], ["e", "程序在执行"], ["a", "等你决定"]].forEach(([cls, label]) => {
    const row = el("div");
    row.append(el("i", cls), el("span", "", label));
    legend.append(row);
  });
  box.append(legend);

  const try_ = el("div", "try");
  SAMPLES.forEach((text) => {
    const b = el("button", "", text);
    b.type = "button";
    b.onclick = () => { input.value = text; resize(); input.focus(); };
    try_.append(b);
  });
  box.append(try_);
  feed.append(box);
}

function clearBlank() {
  const blank = feed.querySelector(".blank");
  if (blank) blank.remove();
}

/* ── 分发 ───────────────────────────────────────── */

const HANDLERS = {
  ready: (e) => {
    // 路径太长时只留尾部两段，那才是分得清项目的部分
    const parts = e.workspace.split("/").filter(Boolean);
    rootPath.textContent = parts.length > 2 ? "…/" + parts.slice(-2).join("/") : e.workspace;
    rootPath.title = e.workspace;
  },
  user_message: onTask,
  assistant_message: onSay,
  tool_call: onToolCall,
  tool_result: onToolResult,
  permission_request: onAsk,
  permission_result: onAskDone,
  error: onFail,
  busy: () => setBusy(true),
  idle: () => setBusy(false),
  reset,
};

function handle(event) {
  cursor = event.id;
  if (event.type !== "ready" && event.type !== "reset") clearBlank();
  const fn = HANDLERS[event.type];
  if (fn) fn(event);
}

/* ── 连接 ───────────────────────────────────────── */

function connect() {
  const source = new EventSource(`/api/events?after=${cursor}`);
  source.onmessage = (m) => handle(JSON.parse(m.data));
  source.onopen = () => {
    if (!busy) { stateText.textContent = "就绪"; stateBox.className = "state"; }
  };
  source.onerror = () => {
    source.close();
    stateText.textContent = "连接断开，重连中";
    stateBox.className = "state off";
    setTimeout(connect, 1200);
  };
}

async function answer(requestId, allowed, gate) {
  gate.querySelectorAll("button").forEach((b) => { b.disabled = true; });
  await fetch("/api/permission", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ request_id: requestId, allowed }),
  });
}

async function send() {
  const message = input.value.trim();
  if (!message || busy) return;
  input.value = "";
  resize();
  const res = await fetch("/api/message", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message }),
  });
  if (!res.ok) { input.value = message; resize(); }
}

function resize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 144) + "px";
}

document.querySelector("#composer").onsubmit = (e) => { e.preventDefault(); send(); };
clearBtn.onclick = () => fetch("/api/reset", { method: "POST" });
input.oninput = resize;
input.onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
};

showBlank();
resize();
connect();
</script>
</body>
</html>
